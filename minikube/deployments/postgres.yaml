apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: auth
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:15.8
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
          envFrom:
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: application
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: postgres
          image: postgres:15.8
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
          envFrom:
            - configMapRef:
                name: postgres
            - secretRef:
                name: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-postgres
  namespace: auth
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-postgres
  namespace: application
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: postgres
