apiVersion: apps/v1
kind: Deployment
metadata:
  namespace: application
  name: web-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web-api
  template:
    metadata:
      labels:
        app: web-api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: web-api
          image: my-web-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
            - name: health-port
              containerPort: 9000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
          startupProbe:
            httpGet:
              path: /q/health/started
              port: health-port
              scheme: HTTP
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /q/health/ready
              port: health-port
              scheme: HTTP
            failureThreshold: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /q/health/live
              port: health-port
              scheme: HTTP
            failureThreshold: 2
            periodSeconds: 10
          envFrom:
            - configMapRef:
                name: web-api
            - secretRef:
                name: web-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: pdb-web-api
  namespace: application
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web-api
